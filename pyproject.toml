[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "cms-dimuon-starter"
version = "0.1.0"
description = "Learning scaffold for bounded CMS dimuon data inspection"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "aiohttp>=3.14.3",
  "awkward>=2.6,<3",
  "matplotlib>=3.11.2",
  "numpy>=2.0,<3",
  "requests>=2.34.2",
  "scipy>=1.18.1",
  "uproot>=5.6,<6",
]

[project.optional-dependencies]
remote = ["xrootd>=5.8,<6", "fsspec-xrootd>=0.5,<1"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
dimuon = "dimuon.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dimuon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
